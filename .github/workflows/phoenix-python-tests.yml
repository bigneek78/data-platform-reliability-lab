name: Project Phoenix validation

on:
  push:
    paths:
      - 'phoenix-engineering-labs/**'
      - '.github/workflows/phoenix-python-tests.yml'
  pull_request:
    paths:
      - 'phoenix-engineering-labs/**'
      - '.github/workflows/phoenix-python-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: phoenix-engineering-labs

jobs:
  tests:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.12', '3.13']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run behavioral and CLI tests
        run: python -m unittest discover -s tests -v
      - name: Reproduce all fifteen recorded fixtures
        run: python tools/verify_samples.py
      - name: Parse the read-only PowerShell collectors
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Get-ChildItem -Recurse -Filter '*.ps1' | ForEach-Object {
            $tokens = $null
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
